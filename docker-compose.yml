services:
  postgres:
    image: timescale/timescaledb:2.27.1-pg16
    container_name: cryptoattack-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cryptoattack}
      POSTGRES_USER: ${POSTGRES_USER:-cryptoattack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptoattack}
    volumes:
      - cryptoattack-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  cryptoattack-postgres:
