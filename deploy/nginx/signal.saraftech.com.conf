# =====================================================================
# Nginx reverse proxy — signal.saraftech.com -> 127.0.0.1:3001
#
# Joylash (VM da):
#   sudo cp deploy/nginx/signal.saraftech.com.conf \
#           /etc/nginx/sites-available/signal.saraftech.com
#   sudo ln -s /etc/nginx/sites-available/signal.saraftech.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Keyin TLS sertifikat:
#   sudo certbot --nginx -d signal.saraftech.com
# certbot avtomatik 443 (ssl) server-block va 80->443 redirect qo'shadi,
# pastdagi location'larni saqlab qoladi.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name signal.saraftech.com;

    # Butun saytni HTTP Basic Auth bilan yopamiz (API + SSE + UI).
    # Foydalanuvchi/parol: sudo htpasswd -c /etc/nginx/.htpasswd-signal admin
    auth_basic           "CryptoAttack Signal";
    auth_basic_user_file /etc/nginx/.htpasswd-signal;

    # Certbot ACME challenge auth'dan ozod bo'lishi shart.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # Health check — monitoring uchun auth'siz.
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE oqimi — buferlash O'CHIQ bo'lishi shart (realtime alertlar).
    location /api/stream {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # API + statik frontend (server o'zi apps/web/dist ni xizmat qiladi).
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript;
}
